services:
  postgres:
    image: postgres:16-alpine
    container_name: blueberry-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blueberry
    volumes:
      - blueberry_pg_data:/var/lib/postgresql/data

volumes:
  blueberry_pg_data:
